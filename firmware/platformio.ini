; PaperMono 電子名刺
; 公式ドキュメント (docs.m5stack.com/en/core/PaperMono) の PlatformIO 設定に準拠

[env:papermono]
platform = espressif32@6.12.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
; Bluetooth ポートを誤検出しないよう USB に限定
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; PaperMono 対応は M5Unified / M5GFX の develop ブランチに入っている
lib_deps =
    https://github.com/m5stack/M5GFX.git#develop
    https://github.com/m5stack/M5Unified.git#develop
    https://github.com/m5stack/M5UnitUnified.git
    https://github.com/m5stack/M5Unit-NFC.git

; NFC エミュレーションの切り分け用（公式サンプル相当の最小構成）
[env:nfctest]
extends = env:papermono
build_src_filter = -<*> +<../nfctest/>

; NFC アンテナ確認用（交通系 IC カードを読む）
[env:nfcreader]
extends = env:papermono
build_src_filter = -<*> +<../nfcreader/>

; NFC の電波とアンテナ位置の診断
[env:nfcdiag]
extends = env:papermono
build_src_filter = -<*> +<../nfcdiag/>
